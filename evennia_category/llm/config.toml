# llm 配置（Embedder/Summarizer 创建函数消费；与 config.py 同目录）
# TOML 无 null，可选键缺省由 .get() → None。

[embedding]
# Embedding 模型配置（Embedder 创建函数消费）。
model          = "ollama/qwen3-embedding:4b"   # 完整模型名（含 provider 前缀）
api_base       = "http://localhost:11434"      # API 地址
# api_key      = "..."                         # 可选，缺失为 None
dimension      = 1024                          # 向量维度
batch_size     = 8                             # 批量 embed 每批数量
max_retries    = 3                             # embed 失败重试次数
num_gpu        = -1                            # Ollama GPU 层数（-1 = 全部）

[summarizer]
# 摘要 LLM 配置（Summarizer 创建函数消费）。
model              = "anthropic/deepseek-v4-flash"  # 完整模型名（含 provider 前缀；火山方舟 ark，走 anthropic/ Messages 兼容端点）
api_base           = "https://ark.cn-beijing.volces.com/api/coding"  # 火山方舟 ark API 地址（与 adapters config.toml 同源）
api_key            = "aa7eae8f-aaec-48b6-aa62-04556b2a744a"  # 火山方舟 API Key（与 adapters config.toml 同源；缺失为 None）
temperature        = 0.0                       # 采样温度
max_tokens         = -1   # -1=不限制（config.py 转 None 传 LLM；TOML 无 null 用 -1 表 None；绝不设正值）
summary_min_length = 512                       # 短文本阈值（低于此不调 LLM，原样返回）
max_retries        = 3                         # summarize 失败重试次数
num_gpu            = 0                         # Ollama GPU 层数
